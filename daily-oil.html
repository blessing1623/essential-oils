            border-radius: 60px;

        .card-preview {

            position: relative;

            align-items: center;
            justify-content: center;
            position: relative;
        }

            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            padding: 6px;
            background: rgba(255, 248, 240, 0.4);
            transition: opacity 0.3s ease;
        }
        .oil-image-wrapper .img-placeholder {
            font-size: 4rem;
            opacity: 0.4;
            color: #b7a48b;
        }
        .oil-image-wrapper.loading img {
            opacity: 0.3;
        }
        .oil-image-wrapper.loading::after {
            content: '⏳';
            position: absolute;
            font-size: 2.5rem;
            color: #b7a48b;
            animation: pulse 0.8s ease-in-out infinite;
        }
        .oil-image-wrapper.has-error img {
            display: none;
        }
        .oil-image-wrapper.has-error .img-placeholder {
            display: block;
        }
        .oil-image-wrapper .img-placeholder {
            display: none;
        }
        .oil-image-wrapper.has-error .img-placeholder {
            display: block;
        }

              detail: '你充滿獨立精神，能自信地走自己的路，不受他人影響。',
              reminder: '今天，自信地走自己的路，那是屬於你的獨特風景。' }
        ];

        // ============================================================
        // 圖片路徑設定（與主頁一致）
        // ============================================================
        const IMG_BASE_PATH = 'img/';

        // ============================================================
        // DOM 元素
        // ============================================================
        const oilImageWrapper = document.getElementById('oilImageWrapper');
        const oilImage = document.getElementById('oilImage');
        const oilEmoji = document.getElementById('oilEmoji');
        const oilName = document.getElementById('oilName');
        const oilCategory = document.getElementById('oilCategory');
        const oilMeaning = document.getElementById('oilMeaning');
        const oilDetail = document.getElementById('oilDetail');
        const reminderText = document.getElementById('reminderText');
        const drawBtn = document.getElementById('drawDailyBtn');

        // ============================================================
        // 圖片載入核心 - 自動嘗試 jpg 和 png
        // ============================================================
        function getImagePath(oil, ext) {
            const fileName = oil.id + ' ' + oil.name + '.' + ext;
            return IMG_BASE_PATH + encodeURIComponent(fileName);
        }

        function loadOilImage(oil, callback) {
            const extensions = ['jpg', 'png'];
            let currentExtIndex = 0;

            function tryLoad() {
                if (currentExtIndex >= extensions.length) {
                    oilImageWrapper.classList.remove('loading');
                    oilImageWrapper.classList.add('has-error');
                    oilImage.style.display = 'none';
                    if (callback) callback(false);
                    return;
                }

                const ext = extensions[currentExtIndex];
                const imgPath = getImagePath(oil, ext);
                oilImage.src = imgPath;
                oilImage.style.display = 'block';

                oilImage.onload = function() {
                    oilImageWrapper.classList.remove('loading', 'has-error');
                    oilImage.style.display = 'block';
                    if (callback) callback(true);
                };

                oilImage.onerror = function() {
                    currentExtIndex++;
                    setTimeout(tryLoad, 200);
                };
            }

            oilImageWrapper.classList.add('loading');
            oilImageWrapper.classList.remove('has-error');
            tryLoad();
        }

        // ============================================================
        // 隨機取一筆精油
        // ============================================================
        function getRandomOil() {
            const randomIndex = Math.floor(Math.random() * oils.length);
            return oils[randomIndex];
        }

        // ============================================================
        // 渲染卡片（含圖片）
        // ============================================================
        function renderOil(oil) {
            // 文字資訊
            oilEmoji.textContent = oil.emoji;
            oilName.textContent = oil.name;
            oilCategory.textContent = oil.category;
            oilMeaning.textContent = oil.meaning;
            oilDetail.innerHTML = `${oil.detail} <span>🌿 今日香氣提醒</span>`;
            reminderText.innerHTML = `<i>「${oil.reminder}」</i>`;

            // 載入圖片
            loadOilImage(oil);
        }

        // ============================================================
        // 抽卡 + 動畫效果
        // ============================================================
        function drawDaily() {
            const card = document.getElementById('dailyCard');
            const reminder = document.getElementById('dailyReminder');
            
            card.style.transition = 'transform 0.15s ease, opacity 0.15s ease';
            card.style.transform = 'scale(0.96)';
            card.style.opacity = '0.6';
            reminder.style.transition = 'opacity 0.15s ease';
            reminder.style.opacity = '0.5';
            
            setTimeout(() => {
                const oil = getRandomOil();
                renderOil(oil);
                card.style.transform = 'scale(1)';
                card.style.opacity = '1';
                reminder.style.opacity = '1';
            }, 200);
        }

        // ============================================================
        // 事件綁定 + 初始顯示
        // ============================================================
        drawBtn.addEventListener('click', drawDaily);

        window.addEventListener('load', () => {
            const initialOil = getRandomOil();
            renderOil(initialOil);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                drawDaily();
            }
        });
    </script>
